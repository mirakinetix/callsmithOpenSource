name: Package Callsmith for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Windows x64 application image
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          architecture: x64
          cache: maven

      - name: Build and verify Windows application image
        id: package
        shell: pwsh
        run: .\packaging\windows\build-app-image.ps1

      # This repository is public. Upload the verification report only.
      - name: Upload Windows verification report
        uses: actions/upload-artifact@v6
        with:
          name: Callsmith-${{ steps.package.outputs.version }}-windows-x64-verification
          path: packaging/windows/build/package-evidence.txt
          if-no-files-found: error
          retention-days: 7
