name: Verify Callsmith

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  maven-verify:
    name: Maven verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run headless regression suite
        run: mvn -B verify
