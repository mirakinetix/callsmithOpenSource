name: Verify Callsmith

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  maven-verify:
    name: Maven verify (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Run headless regression suite
        run: mvn -B verify
