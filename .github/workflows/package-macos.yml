name: Package Callsmith for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-macos:
    name: macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          architecture: ${{ matrix.architecture }}
          cache: maven

      - name: Build and verify macOS disk image
        id: package
        run: bash ./packaging/macos/build-app-image.sh

      # This repository is public. Upload the verification report only.
      - name: Upload macOS verification report
        uses: actions/upload-artifact@v6
        with:
          name: Callsmith-${{ steps.package.outputs.version }}-macos-${{ matrix.architecture }}-verification
          path: packaging/macos/build/package-evidence.txt
          if-no-files-found: error
          retention-days: 7
